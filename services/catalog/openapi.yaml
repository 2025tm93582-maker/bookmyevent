openapi: 3.0.3
info:
    title: BookMyEvent — Catalog Service
    version: 1.0.0
    description: Events, categories and shows with tier prices.
servers:
    - url: http://localhost:3001

paths:
    /health:
        get:
            summary: Service and database health
            responses:
                "200":
                    {
                        description: Up,
                        content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } },
                    }
                "503":
                    {
                        description: Database down,
                        content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } },
                    }

    /api/v1/categories:
        get:
            summary: List categories
            responses:
                "200":
                    {
                        description: OK,
                        content:
                            {
                                application/json:
                                    { schema: { type: array, items: { $ref: "#/components/schemas/Category" } } },
                            },
                    }
        post:
            summary: Create a category
            requestBody:
                { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } }
            responses:
                "201":
                    {
                        description: Created,
                        content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } },
                    }
                "400": { $ref: "#/components/responses/BadRequest" }
                "409": { $ref: "#/components/responses/Conflict" }

    /api/v1/events:
        get:
            summary: List events
            parameters:
                - { name: category, in: query, required: false, schema: { type: string, example: CONCERT } }
            responses:
                "200":
                    {
                        description: OK,
                        content:
                            {
                                application/json:
                                    { schema: { type: array, items: { $ref: "#/components/schemas/Event" } } },
                            },
                    }
        post:
            summary: Create an event
            requestBody:
                {
                    required: true,
                    content: { application/json: { schema: { $ref: "#/components/schemas/EventCreate" } } },
                }
            responses:
                "201":
                    {
                        description: Created,
                        content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } },
                    }
                "400": { $ref: "#/components/responses/BadRequest" }
                "422": { $ref: "#/components/responses/Unprocessable" }

    /api/v1/events/{id}:
        get:
            summary: Get an event
            parameters: [{ $ref: "#/components/parameters/Id" }]
            responses:
                "200":
                    {
                        description: OK,
                        content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } },
                    }
                "400": { $ref: "#/components/responses/BadRequest" }
                "404": { $ref: "#/components/responses/NotFound" }

    /api/v1/events/{id}/shows:
        get:
            summary: List shows of an event
            parameters: [{ $ref: "#/components/parameters/Id" }]
            responses:
                "200":
                    {
                        description: OK,
                        content:
                            {
                                application/json:
                                    { schema: { type: array, items: { $ref: "#/components/schemas/Show" } } },
                            },
                    }
                "404": { $ref: "#/components/responses/NotFound" }
        post:
            summary: Create a show (BR-C1, BR-C2)
            parameters: [{ $ref: "#/components/parameters/Id" }]
            requestBody:
                {
                    required: true,
                    content: { application/json: { schema: { $ref: "#/components/schemas/ShowCreate" } } },
                }
            responses:
                "201":
                    {
                        description: Created,
                        content: { application/json: { schema: { $ref: "#/components/schemas/Show" } } },
                    }
                "400": { $ref: "#/components/responses/BadRequest" }
                "404": { $ref: "#/components/responses/NotFound" }
                "422": { $ref: "#/components/responses/Unprocessable" }

    /api/v1/shows/{id}:
        get:
            summary: Get a show with prices (used by Booking)
            parameters: [{ $ref: "#/components/parameters/Id" }]
            responses:
                "200":
                    {
                        description: OK,
                        content: { application/json: { schema: { $ref: "#/components/schemas/Show" } } },
                    }
                "400": { $ref: "#/components/responses/BadRequest" }
                "404": { $ref: "#/components/responses/NotFound" }

components:
    parameters:
        Id: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }

    schemas:
        Health:
            type: object
            properties:
                status: { type: string, enum: [UP, DOWN] }
                service: { type: string, example: catalog }
                db: { type: string, enum: [UP, DOWN] }
        Category:
            type: object
            required: [code, name]
            properties:
                code: { type: string, example: WORKSHOP }
                name: { type: string, example: Workshop }
        EventCreate:
            type: object
            required: [title, category, durationMinutes]
            properties:
                title: { type: string, minLength: 2, maxLength: 150, example: Arijit Singh Live }
                category: { type: string, example: CONCERT }
                description: { type: string, maxLength: 2000 }
                durationMinutes: { type: integer, minimum: 10, maximum: 600, example: 180 }
        Event:
            allOf:
                - $ref: "#/components/schemas/EventCreate"
                - type: object
                  properties:
                      id: { type: integer, example: 1 }
                      createdAt: { type: string, format: date-time }
        Price:
            type: object
            required: [tier, price]
            properties:
                tier: { type: string, example: GOLD }
                price: { type: number, exclusiveMinimum: true, minimum: 0, example: 3500 }
        ShowCreate:
            type: object
            required: [venue, startsAt, prices]
            properties:
                venue: { type: string, example: "JLN Stadium, Delhi" }
                startsAt: { type: string, format: date-time, example: "2026-12-20T19:30:00+05:30" }
                prices: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/Price" } }
        Show:
            type: object
            properties:
                id: { type: integer }
                eventId: { type: integer }
                eventTitle: { type: string }
                venue: { type: string }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                prices: { type: array, items: { $ref: "#/components/schemas/Price" } }
        Error:
            type: object
            properties:
                error:
                    type: object
                    properties:
                        code: { type: string, example: VALIDATION_FAILED }
                        message: { type: string }
                        details:
                            {
                                type: array,
                                items:
                                    {
                                        type: object,
                                        properties: { field: { type: string }, message: { type: string } },
                                    },
                            }
                        correlationId: { type: string }

    responses:
        BadRequest:
            {
                description: Malformed request,
                content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
            }
        NotFound:
            {
                description: Not found,
                content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
            }
        Conflict:
            {
                description: Conflicts with existing state,
                content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
            }
        Unprocessable:
            {
                description: Breaks a business rule,
                content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
            }
