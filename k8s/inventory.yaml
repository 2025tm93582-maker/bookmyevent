apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: bookmyevent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
      containers:
        - name: inventory
          image: bookmyevent-inventory:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: SERVICE_NAME
              value: "inventory"
            - name: DB_HOST
              value: "mysql"
            - name: DB_USER
              value: "inventory_user"
            - name: DB_NAME
              value: "inventory_db"
            - name: HOLD_STRATEGY
              value: "atomic"
            - name: FAULT_CONFIRM_FAIL
              value: "false"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookmyevent-secrets
                  key: INVENTORY_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: bookmyevent
spec:
  type: LoadBalancer
  selector:
    app: inventory
  ports:
    - port: 3002
      targetPort: 3002
