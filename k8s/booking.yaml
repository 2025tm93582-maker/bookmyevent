apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  namespace: bookmyevent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
      containers:
        - name: booking
          image: bookmyevent-booking:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: SERVICE_NAME
              value: "booking"
            - name: DB_HOST
              value: "mysql"
            - name: DB_USER
              value: "booking_user"
            - name: DB_NAME
              value: "booking_db"
            - name: CATALOG_URL
              value: "http://catalog:3001/api/v1"
            - name: INVENTORY_URL
              value: "http://inventory:3002/api/v1"
            - name: PAYMENT_URL
              value: "http://payment:3004/api/v1"
            - name: NOTIFICATION_URL
              value: "http://notification:3005/api/v1"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookmyevent-secrets
                  key: BOOKING_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: booking
  namespace: bookmyevent
spec:
  type: LoadBalancer
  selector:
    app: booking
  ports:
    - port: 3003
      targetPort: 3003
