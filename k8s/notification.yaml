apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: bookmyevent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
      containers:
        - name: notification
          image: bookmyevent-notification:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: SERVICE_NAME
              value: "notification"
            - name: DB_HOST
              value: "mysql"
            - name: DB_USER
              value: "notification_user"
            - name: DB_NAME
              value: "notification_db"
            - name: NOTIFY_DELAY_MS
              value: "0"
            - name: NOTIFY_FAIL_RATE
              value: "0"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookmyevent-secrets
                  key: NOTIFICATION_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: bookmyevent
spec:
  type: LoadBalancer
  selector:
    app: notification
  ports:
    - port: 3005
      targetPort: 3005
