apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: bookmyevent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
      containers:
        - name: catalog
          image: bookmyevent-catalog:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: SERVICE_NAME
              value: "catalog"
            - name: DB_HOST
              value: "mysql"
            - name: DB_USER
              value: "catalog_user"
            - name: DB_NAME
              value: "catalog_db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookmyevent-secrets
                  key: CATALOG_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: bookmyevent
spec:
  type: LoadBalancer
  selector:
    app: catalog
  ports:
    - port: 3001
      targetPort: 3001
