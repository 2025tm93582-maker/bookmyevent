apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: bookmyevent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
      containers:
        - name: payment
          image: bookmyevent-payment:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: SERVICE_NAME
              value: "payment"
            - name: DB_HOST
              value: "mysql"
            - name: DB_USER
              value: "payment_user"
            - name: DB_NAME
              value: "payment_db"
            - name: PAYMENT_DELAY_MS
              value: "0"
            - name: PAYMENT_FAIL_RATE
              value: "0"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookmyevent-secrets
                  key: PAYMENT_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: bookmyevent
spec:
  type: LoadBalancer
  selector:
    app: payment
  ports:
    - port: 3004
      targetPort: 3004
